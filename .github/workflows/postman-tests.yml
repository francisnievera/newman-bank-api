name: Postman API Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node Version
        run: node -v

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Verify Newman Version
        run: newman -v

      - name: Create Reports Folder
        run: |
          mkdir reports
          touch reports/results.json
          touch reports/results.xml
          touch reports/results.html

      - name: Run Postman Collection
        continue-on-error: true
        run: |
          newman run "Bank API.postman_collection.json" \
          -d accounts.csv \
          -r cli,json,junit,htmlextra \
          --reporter-json-export reports/results.json \
          --reporter-junit-export reports/results.xml \
          --reporter-htmlextra-export reports/results.html

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-reports
          path: reports